[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-pulmonary-disease-classification"
version = "0.1.0"
description = "Reproducible generation and classification of a physiology-inspired synthetic pulmonary dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sergio Pascual Redondo" }
]
dependencies = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.1,<5",
  "matplotlib>=3.8,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "plotly>=5.20,<7",
  "scikit-learn>=1.4,<2",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "reports"]

